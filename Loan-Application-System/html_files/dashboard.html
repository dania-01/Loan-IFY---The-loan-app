<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Application Dashboard</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css_files/dashboard.css">

  <!-- Bootstrap JS Bundle (important for navbar toggle) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>

  <nav class="navbar navbar-expand-md bg-light">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="homepage.html">
  <img src="../assests_file/Loanify-titlelogo.png" alt="Loanify Logo" height="40" class="me-2">
  <span>Loan-IFY</span>
</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="homepage.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contact.html">Contact Us</a>
          </li>
          <li class="nav-item">
            <button id="themeToggle" class="btn btn-secondary ms-2">Toggle Theme</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4" id="dashboard-container">
    <header>
      <h1>Welcome, <span id="username">Username</span></h1>
    </header>

    <section id="total-loan-info">
      <h2>Total Loan</h2>
      <p id="total-loan-amount">--</p>
    </section>

    <section id="active-loan">
      <h2>Active Loan</h2>
      <p id="active-loan-details">--</p>
    </section>

    <section id="upcoming-payments">
      <h2>Upcoming Payments</h2>
      <div id="upcoming-payments-details">--</div>
    </section>

    <section id="apply-loan">
      <a href="apply-loan.html">
        <button id="apply-loan-button" class="btn btn-primary">Apply for Loan</button>
      </a>
    </section>

    <section id="loan-history">
      <h2>Loan History</h2>
      <div class="table-responsive">
        <table class="table table-striped table-hover" id="loan-history-table">
          <thead>
            <tr>
              <th>Loan ID</th>
              <th>Amount</th>
              <th>Type</th>
              <th>Status</th>
              <th>Start Date</th>
              <th>End Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="loan-history-body">
            <tr>
              <td colspan="7">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <button id="logout-btn" class="btn btn-danger mt-4">Logout</button>
  </div>
  <footer>
    <p>&copy; 2025 Loan-IFY Inc. All rights reserved.</p>
</footer>

  <script type="module" src="../js_files/dashboard.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const body = document.body;

      if (localStorage.getItem("theme") === "dark") {
        body.classList.add("dark-mode");
      }

      const toggleBtn = document.getElementById("themeToggle");
      if (toggleBtn) {
        toggleBtn.addEventListener("click", () => {
          body.classList.toggle("dark-mode");
          localStorage.setItem("theme", body.classList.contains("dark-mode") ? "dark" : "light");
        });
      }
    });
  </script>

</body>
</html>
