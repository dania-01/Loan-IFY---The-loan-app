<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Loan-IFY</title>
  <link rel="icon" href="../assests_file/Loanify-titlelogo.png" type="image/x-icon">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <!-- Nav + Custom CSS -->
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('pre-dark');</script>
  <link rel="stylesheet" href="../css_files/nav.css">
  <link rel="stylesheet" href="../css_files/dashboard.css">
  <style>html.pre-dark body { background: #0a0f1a; }</style>

</head>
<body>
<script>if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark-mode');</script>

  <nav class="site-nav" id="siteNav">
    <div class="nav-inner">
      <a href="homepage.html" class="nav-brand">
        <img src="../assests_file/Loanify-titlelogo.png" alt="Loan-IFY" class="nav-logo">
        <span class="nav-title">Loan-IFY</span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="homepage.html">Home</a>
        <a href="apply-loan.html">Apply Loan</a>
        <a href="emi-calculator.html">EMI Calculator</a>
        <a href="contact.html">Contact</a>
      </div>
      <div class="nav-end">
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
      <button class="nav-hamburger" id="hamburgerBtn" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="container mt-4" id="dashboard-container">
    <header class="dash-header">
      <div>
        <p class="dash-greeting">Good day,</p>
        <h1 class="dash-username"><span id="username">Username</span></h1>
      </div>

      <!-- Loan limit widget + action buttons -->
      <div class="dash-header-right">
        <div class="loan-limit-widget">
          <div class="llw-top">
            <span class="llw-label">Credit Limit</span>
            <span id="llw-pct" class="llw-pct">—</span>
          </div>
          <div class="llw-track">
            <div id="llw-fill" class="llw-fill"></div>
          </div>
          <div class="llw-bottom">
            <span id="llw-used">—</span>
            <span id="llw-remain">—</span>
          </div>
        </div>
        <div class="dash-actions">
          <button id="apply-loan-button">+ Apply for Loan</button>
          <a href="emi-calculator.html" class="btn-emi-link">EMI Calculator</a>
        </div>
      </div>
    </header>

    <!-- STAT STRIP -->
    <div id="loan-stats-container">
      <div id="total-loan-info" class="stat-tile">
        <span class="stat-tile-label">Total Applied</span>
        <p id="total-loan-amount" class="stat-tile-value">--</p>
      </div>
      <div id="active-loan" class="stat-tile">
        <span class="stat-tile-label">Active Loans</span>
        <div id="active-loan-details" class="stat-tile-loan-detail">--</div>
      </div>
    </div>

    <section id="upcoming-payments">
      <h2>Upcoming Payments</h2>
      <div id="upcoming-payments-details">--</div>
    </section>

    <section id="loan-history">
      <h2>Loan History</h2>
      <div class="table-responsive">
        <table id="loan-history-table">
          <thead>
            <tr>
              <th>Loan ID</th>
              <th>Amount</th>
              <th>Type</th>
              <th>Status</th>
              <th>Start Date</th>
              <th>End Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="loan-history-body">
            <tr>
              <td colspan="7">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <button id="logout-btn">Logout</button>
  </div>
  <footer>
    <p>&copy; <script>document.write(new Date().getFullYear())</script> Loan-IFY Inc. All rights reserved.</p>
</footer>

  <script type="module" src="../js_files/dashboard.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("theme") === "dark") document.body.classList.add("dark-mode");

      document.getElementById("themeToggle")?.addEventListener("click", () => {
        document.body.classList.toggle("dark-mode");
        localStorage.setItem("theme", document.body.classList.contains("dark-mode") ? "dark" : "light");
      });

      document.getElementById("hamburgerBtn")?.addEventListener("click", () => {
        document.getElementById("navLinks")?.classList.toggle("open");
      });
    });
  </script>

</body>
</html>
