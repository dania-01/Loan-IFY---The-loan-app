<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" href="../assests_file/Loanify-titlelogo.png">
    <title>Loanify - Sign Up</title>
    <link rel="stylesheet" href="../css_files/signup.css"/>
</head>
<body>
    <nav>
        <a href="homepage.html">Home</a>
        <a href="contact.html">Contact Us</a>
    </nav>
    <div class="container">
        <img src="../assests_file/loanifyLogo.png" alt="Loanify Logo" class="logo" />

        <h2>Sign Up</h2>
        <input id="signup-name" type="text" placeholder="Enter your name" required />
        <input id="signup-email" type="email" placeholder="Enter email" required />
        <input id="signup-password" type="password" placeholder="Create password" required />
        <button id="signup-btn">Create Account</button>
        <p id="signup-msg"></p>

        <p>Already have an account? <a href="../">Login</a></p>
    </div>

    <footer>
        <p>&copy; 2025 Loan-IFY Inc. All rights reserved.</p>
    </footer>
    
    <script type="module" src="../js_files/auth.js"> </script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
          const body = document.body;
          const themeIcon = document.getElementById("themeIcon");
        
          if (localStorage.getItem("theme") === "dark") {
            body.classList.add("dark-mode");
            if (themeIcon) themeIcon.textContent = "☀️ Light Mode";
          }
        
          const toggleBtn = document.getElementById("themeToggle");
          if (toggleBtn) {
            toggleBtn.addEventListener("click", () => {
              body.classList.toggle("dark-mode");
              const isDark = body.classList.contains("dark-mode");
              localStorage.setItem("theme", isDark ? "dark" : "light");
              if (themeIcon) themeIcon.textContent = isDark ? "☀️ Light Mode" : "🌙 Dark Mode";
            });
          }
        });
        </script>  
</body>
</html>
