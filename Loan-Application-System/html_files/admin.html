<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan-IFY — Admin</title>
  <link rel="icon" href="../assests_file/Loanify-titlelogo.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css_files/nav.css">
  <link rel="stylesheet" href="../css_files/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="site-nav" id="siteNav">
    <div class="nav-inner">
      <a href="homepage.html" class="nav-brand">
        <img src="../assests_file/Loanify-titlelogo.png" alt="Loan-IFY" class="nav-logo">
        <span class="nav-title">Loan-IFY</span>
        <span class="nav-badge">Admin</span>
      </a>
      <div class="nav-links" id="navLinks"></div>
      <div class="nav-end">
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button id="logout-btn" class="nav-btn nav-btn-danger">Logout</button>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="admin-container">

    <!-- PAGE HEADER -->
    <div class="admin-page-header">
      <div>
        <h1 class="page-title">Loan Applications</h1>
        <p class="page-subtitle">Review and manage all pending loan requests</p>
      </div>
    </div>

    <!-- STAT CARDS -->
    <div class="stat-grid">
      <div class="stat-card total">
        <div class="stat-card-top">
          <span class="stat-label">Total</span>
          <span class="stat-card-icon"><i class="fas fa-file-alt"></i></span>
        </div>
        <span class="stat-value" id="stat-total">—</span>
      </div>
      <div class="stat-card pending">
        <div class="stat-card-top">
          <span class="stat-label">Pending</span>
          <span class="stat-card-icon"><i class="fas fa-clock"></i></span>
        </div>
        <span class="stat-value" id="stat-pending">—</span>
      </div>
      <div class="stat-card approved">
        <div class="stat-card-top">
          <span class="stat-label">Approved</span>
          <span class="stat-card-icon"><i class="fas fa-check-circle"></i></span>
        </div>
        <span class="stat-value" id="stat-approved">—</span>
      </div>
      <div class="stat-card rejected">
        <div class="stat-card-top">
          <span class="stat-label">Rejected</span>
          <span class="stat-card-icon"><i class="fas fa-times-circle"></i></span>
        </div>
        <span class="stat-value" id="stat-rejected">—</span>
      </div>
    </div>

    <!-- FILTER BAR -->
    <div class="filter-bar">
      <span class="filter-label"><i class="fas fa-filter"></i> Filter by status</span>
      <select id="status-filter">
        <option value="all">All Applications</option>
        <option value="pending">Pending</option>
        <option value="accepted">Accepted</option>
        <option value="rejected">Rejected</option>
      </select>
    </div>

    <!-- TABLE -->
    <div class="table-wrapper">
      <table id="loan-table">
        <thead>
          <tr>
            <th>User Email</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Status</th>
            <th>Purpose</th>
            <th>Interest Rate</th>
            <th>Duration</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="8" style="text-align:center;color:var(--muted);padding:24px;">Loading…</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <footer>
    <p>&copy; <script>document.write(new Date().getFullYear())</script> Loan-IFY Inc. All rights reserved.</p>
  </footer>

  <script type="module" src="../js_files/admin.js"></script>
  <script>
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
    document.getElementById('themeToggle')?.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    });
  </script>
</body>
</html>
