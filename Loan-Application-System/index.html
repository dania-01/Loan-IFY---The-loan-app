<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loanify - Login</title>
    <link rel="icon" href="assests_file/Loanify-titlelogo.png">
    <link rel="stylesheet" href="css_files/index.css"> </head>
<body>
    <nav>
        <a href="./html_files/homepage.html">Home</a>
        <a href="./html_files/contact.html">Contact Us</a>
    </nav>
    <div class="container">
        <img src="assests_file/loanifyLogo.png" alt="Loanify Logo" class="logo" />
        <h2>Login</h2>

        <input id="login-email" type="email" placeholder="Enter email" required />
        <input id="login-password" type="password" placeholder="Enter password" required />
        <button id="login-btn">Login </button>
        <p id="login-msg"></p>

        <p>Don't have an account? <a href="./html_files/signup.html">Sign Up</a></p>
    </div>

    <footer>
        <p>&copy; 2025 Loan-IFY Inc. All rights reserved.</p>
    </footer>

    <script type="module" src="./js_files/auth.js"></script>

    <script>
  document.addEventListener("DOMContentLoaded", () => {
  const body = document.body;
  const themeIcon = document.getElementById("themeIcon");

  if (localStorage.getItem("theme") === "dark") {
    body.classList.add("dark-mode");
    if (themeIcon) themeIcon.textContent = "☀️ Light Mode";
  }

  const toggleBtn = document.getElementById("themeToggle");
  if (toggleBtn) {
    toggleBtn.addEventListener("click", () => {
      body.classList.toggle("dark-mode");
      const isDark = body.classList.contains("dark-mode");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      if (themeIcon) themeIcon.textContent = isDark ? "☀️ Light Mode" : "🌙 Dark Mode";
    });
  }
});

    </script>
</body>
</html>
